version: '3.8'

services:
  postgres:
    image: postgres:15-alpine 
    container_name: nextauth_postgres
    environment:
      POSTGRES_USER: root         
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: database      
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: